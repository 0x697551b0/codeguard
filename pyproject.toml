[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard"
version = "1.0.0"
description = "CodeGuard - 基于 LLM 工具调用的代码审查 Agent（软件工程实践 Homework 1）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CodeGuard" }]
keywords = ["agent", "llm", "code-review", "static-analysis", "tool-calling"]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codeguard = "codeguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
